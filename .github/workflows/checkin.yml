# Pipeline de checkin: cada push a main que toque backend/go-checkin lo despliega en el servidor Ubuntu.
# Corre en el runner self-hosted instalado en la VM (ver docs/servidor-ubuntu.md, paso 8).
name: deploy-checkin

on:
  push:
    branches: [main]
    paths:
      - "backend/go-checkin/**"
      - ".github/workflows/checkin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, entradasya]
    env:
      APP_DIR: /opt/entradasya/checkin
      ENV_FILE: /etc/entradasya/checkin.env
    defaults:
      run:
        shell: bash
        working-directory: backend/go-checkin
    steps:
      - uses: actions/checkout@v5

      - name: Verificar y compilar
        run: |
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/checkin" ./cmd/checkin

      - name: Migraciones
        run: |
          set -a; source "$ENV_FILE"; set +a
          go tool goose -dir migrations postgres "$DATABASE_URL" up

      - name: Publicar en $APP_DIR
        run: install -m 755 "$RUNNER_TEMP/checkin" "$APP_DIR/checkin"

      - name: Reiniciar el servicio
        run: sudo systemctl restart entradasya-checkin

      - name: Verificar salud
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4007/health/ready && exit 0
            sleep 1
          done
          journalctl -u entradasya-checkin -n 50 --no-pager
          exit 1
