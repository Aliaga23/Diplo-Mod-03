# Pipeline de notifications: cada push a main que toque backend/node-notifications lo despliega en el servidor Ubuntu.
# Corre en el runner self-hosted instalado en la VM (ver docs/servidor-ubuntu.md, paso 8).
name: deploy-notifications

on:
  push:
    branches: [main]
    paths:
      - "backend/node-notifications/**"
      - ".github/workflows/notifications.yml"
  workflow_dispatch:

concurrency:
  group: deploy-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, entradasya]
    env:
      APP_DIR: /opt/entradasya/notifications
      ENV_FILE: /etc/entradasya/notifications.env
    defaults:
      run:
        shell: bash
        working-directory: backend/node-notifications
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias y verificar tipos
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Publicar en $APP_DIR
        run: |
          rsync -a --delete --exclude node_modules --exclude .env ./ "$APP_DIR/"
          cd "$APP_DIR" && pnpm install --frozen-lockfile --prod

      - name: Reiniciar el servicio
        run: sudo systemctl restart entradasya-notifications

      - name: Verificar salud
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4006/health/ready && exit 0
            sleep 1
          done
          journalctl -u entradasya-notifications -n 50 --no-pager
          exit 1
