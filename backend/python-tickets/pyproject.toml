[project]
name = "python-tickets"
version = "0.1.0"
description = "EntradasYa v1 - servicio tickets"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.164.0",
    "fpdf2>=2.9.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "segno>=1.6.6",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
