# EntradasYa v1 · Nginx: la única puerta de entrada (sección 7 del documento).
# Sirve la web y reenvía cada /api/<servicio>/ a su puerto local, quitando el prefijo.
# payments (4004) y notifications (4006) no tienen ruta: no se exponen hacia afuera.
#
# Instalación (servidor Ubuntu):
#   sudo cp infra/nginx/entradasya.conf /etc/nginx/sites-available/entradasya
#   sudo ln -sf /etc/nginx/sites-available/entradasya /etc/nginx/sites-enabled/entradasya
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream auth_svc    { server 127.0.0.1:4001; keepalive 8; }
upstream events_svc  { server 127.0.0.1:4002; keepalive 8; }
upstream orders_svc  { server 127.0.0.1:4003; keepalive 8; }
upstream tickets_svc { server 127.0.0.1:4005; keepalive 8; }
upstream checkin_svc { server 127.0.0.1:4007; keepalive 8; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/entradasya;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Encabezados comunes hacia los servicios
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Las rutas internas (servicio a servicio) nunca se publican.
    location ~ ^/api/[^/]+/internal(/|$) {
        return 404;
    }

    # La barra final en proxy_pass quita el prefijo: /api/auth/login → /login
    location /api/auth/    { proxy_pass http://auth_svc/; }
    location /api/events/  { proxy_pass http://events_svc/; }
    location /api/orders/  { proxy_pass http://orders_svc/; }
    location /api/tickets/ { proxy_pass http://tickets_svc/; }
    location /api/checkin/ { proxy_pass http://checkin_svc/; }

    # Cualquier otro /api/... (incluye payments y notifications) no existe.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NO_ENCONTRADO","message":"Ruta no encontrada"}}';
    }

    # Archivos con hash de Vite: caché larga.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: toda ruta desconocida devuelve index.html (React Router decide).
    location / {
        expires -1;   # index.html siempre fresco (sin add_header para heredar los de seguridad)
        try_files $uri $uri/ /index.html;
    }
}
